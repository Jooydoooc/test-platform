<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Continuous — Beginner Grammar Test | Lexora</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FAFAF8;--white:#ffffff;
  --ink:#1B2130;--ink-soft:#565C6E;--ink-faint:#8A8FA0;
  --ink-tint:#E4E6EC;--ink-tint-border:#7C8296;
  /* State borders on the question palette carry meaning on their own, so they
     clear WCAG 1.4.11's 3:1 non-text threshold against white — unlike --border,
     which is only ever a decorative card edge. */
  --state-border:#8E94A3;
  --accent:#E3A82B;--accent-tint:#FBF0D8;--accent-deep:#7D561C;
  --border:#E3E1DB;
  --success:#3F8F5F;--success-tint:#E7F3EC;
  --error:#C1473A;--error-tint:#FBEAE8;
  --info:#3E6FA0;--info-tint:#E9F1F8;
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 0 80px;overflow-x:hidden}

/* ── Header ── */
.lx-header{
  width:100%;background:var(--white);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.lx-logo{font-size:1.05rem;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.lx-meta{font-size:.8rem;font-weight:600;color:var(--ink-soft)}

/* ── Progress bar ── */
.progress-wrap{width:100%;height:4px;background:var(--border);position:sticky;top:53px;z-index:99}
.progress-fill{height:100%;background:var(--accent);transition:width .2s ease-out;width:0%}
@media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}

/* ── Cards ── */
.card{
  width:100%;max-width:640px;background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 1px 4px rgba(27,33,48,.06);
  padding:24px 20px;margin-top:24px;
}
@media(min-width:640px){.card{padding:32px 36px}}

/* ── Question meta ── */
.q-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.q-num{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:.75rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;
}
.q-type-badge{
  font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;
}
.badge-mc{background:var(--info-tint);color:var(--info)}
.badge-wo{background:var(--ink-tint);color:var(--ink-soft)}
.badge-tr{background:var(--success-tint);color:var(--success)}

/* ── Prompt ── */
.q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:22px}
.q-prompt{font-size:1.08rem;font-weight:700;color:var(--ink);line-height:1.5}
/* These four take focus programmatically (palette jump, screen change) so the
   student's screen reader announces where they landed. A blanket outline:none
   also hid the ring from sighted keyboard users, who now navigate entirely by
   palette — so suppress the ring only when the browser says the focus was not
   keyboard-driven, and keep it for :focus-visible. */
.q-prompt:focus:not(:focus-visible),
.confirm-card h2:focus:not(:focus-visible),
.score-big:focus:not(:focus-visible){outline:none}
.q-prompt:focus-visible,
.confirm-card h2:focus-visible,
.score-big:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:4px}
/* ── MC Options ── */
.mc-group{display:flex;flex-direction:column;gap:10px;outline:none}
.mc-option{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border:2px solid var(--border);border-radius:12px;cursor:pointer;
  transition:border-color .15s ease-out,background .15s ease-out;
  min-height:44px;user-select:none;position:relative;
}
.mc-option:focus-within,.mc-option:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,33,48,.14);
}
.mc-option[aria-checked="true"]{
  border-color:var(--accent);background:var(--accent-tint);
}
.mc-option input[type=radio]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.mc-indicator{
  width:20px;height:20px;min-width:20px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.mc-option[aria-checked="true"] .mc-indicator{border-color:var(--ink);background:var(--ink)}
.mc-indicator svg{display:none}
.mc-option[aria-checked="true"] .mc-indicator svg{display:block}
.mc-letter{
  font-family:var(--font-mono);font-size:.75rem;font-weight:700;color:var(--ink-faint);min-width:18px;
  text-transform:uppercase;
}
.mc-option[aria-checked="true"] .mc-letter{color:var(--ink)}
.mc-text{font-size:.97rem;color:var(--ink-soft);line-height:1.4}
.mc-option[aria-checked="true"] .mc-text{color:var(--ink);font-weight:600}

/* ── Word order ── */
.wo-instruction{font-size:.82rem;color:var(--ink-soft);margin-bottom:12px}
.wo-answer-area{
  min-height:52px;border:2px dashed var(--border);border-radius:10px;
  padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;
  transition:border-color .15s,background .15s;background:var(--bg);
}
.wo-answer-area.has-tiles{border-style:solid;border-color:var(--accent);background:var(--accent-tint)}
.wo-pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tile{
  padding:9px 14px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--white);cursor:pointer;font-size:.92rem;color:var(--ink-soft);
  min-height:44px;display:flex;align-items:center;
  transition:border-color .15s,background .15s,color .15s;
  font-weight:600;
}
.tile:hover{border-color:var(--ink-faint);background:var(--bg)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tile.placed{background:var(--accent);color:var(--ink);border-color:var(--accent-deep)}
.tile.placed:hover{background:var(--accent-deep);color:var(--white);border-color:var(--accent-deep)}
.wo-reset{
  font-size:.8rem;font-weight:700;color:var(--ink-soft);background:none;border:1px solid var(--border);
  border-radius:8px;padding:6px 14px;cursor:pointer;min-height:44px;
  transition:color .15s,border-color .15s;
}
.wo-reset:hover{color:var(--ink);border-color:var(--ink-faint)}
.wo-reset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── Translation ── */
.tr-label{font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:block}
.tr-input{
  width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:10px;
  font-size:1rem;font-family:var(--font);color:var(--ink);
  transition:border-color .15s,box-shadow .15s;background:var(--white);
}
.tr-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,33,48,.14)}
.tr-hint{font-size:.78rem;color:var(--ink-faint);margin-top:7px}

/* ── Question palette ── */
.palette-card{padding:18px 20px}
.palette-summary-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;list-style:none;font-size:.9rem;font-weight:700;color:var(--ink);
  /* This <summary> toggles the palette open/closed — it's a real control, and
     with no padding of its own it was rendering well under the 44px floor. */
  min-height:44px;
}
.palette-summary-row::-webkit-details-marker{display:none}
.palette-summary-row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.palette-summary-label{display:inline-flex;align-items:center;gap:8px}
/* The native marker is suppressed above, so the chevron is the only visual cue
   that this section collapses — it must actually reflect the open state. */
.palette-chevron{flex-shrink:0;color:var(--ink-soft);transition:transform .15s ease-out}
details[open] .palette-chevron{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.palette-chevron{transition:none}}
.palette-count{
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:.78rem;font-weight:600;color:var(--ink-soft);
}
.palette-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
/* 44px, not the usual 38px. These tiles are read-only status, not navigation —
   the test is strictly one-way — but they still sit in a touch-heavy layout
   next to controls that do meet the floor, so they hold the same size rather
   than reading as a smaller, different kind of thing. */
.palette-tile{
  position:relative;width:44px;height:44px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;border:1.5px solid var(--state-border);background:var(--white);color:var(--ink-soft);
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;
  cursor:default;transition:border-color .15s,background .15s,color .15s;
}
.palette-tile.is-answered{border-color:var(--ink-tint-border);background:var(--ink-tint);color:var(--ink)}
.palette-tile.is-current{border-color:var(--ink);background:var(--ink);color:var(--white)}
.palette-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:.75rem;color:var(--ink-soft)}
.palette-legend-item{display:inline-flex;align-items:center;gap:6px}
.palette-legend-swatch{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--state-border);background:var(--white)}
.palette-legend-swatch.current{background:var(--ink);border-color:var(--ink)}
.palette-legend-swatch.answered{background:var(--ink-tint);border-color:var(--ink-tint-border)}

/* ── Navigation ── */
.nav-row{
  width:100%;max-width:640px;display:flex;align-items:center;justify-content:flex-end;
  gap:12px;margin-top:20px;padding:0 4px;flex-wrap:wrap;row-gap:10px;
}
/* Sole control in the row for students — the test stays strictly one-way for
   them. Teacher/admin preview additionally shows #btnPrevious (see .has-prev),
   which is why this pushes to flex-end rather than assuming it always fills
   the row alone. Two classes deep so it beats .btn-primary's max-width, which
   is declared after this block. */
.btn.btn-review{max-width:none;flex:0 0 auto;min-width:200px}
@media(max-width:479px){.btn.btn-review{width:100%;min-width:0}}
/* Preview-only: set when #btnPrevious is visible, so it sits at the opposite
   end of the row from the advance button instead of stacking next to it. */
.nav-row.has-prev{justify-content:space-between}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:13px 22px;border-radius:12px;font-size:.95rem;font-weight:700;
  cursor:pointer;border:none;transition:background .15s,box-shadow .15s,opacity .15s,border-color .15s,color .15s;
  min-height:48px;
}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn-ghost{background:var(--white);color:var(--ink-soft);border:1.5px solid var(--border)}
.btn-ghost:hover:not(:disabled){background:var(--bg);border-color:var(--ink-faint);color:var(--ink)}
.btn-ghost:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--ink);color:var(--white);flex:1;max-width:220px}
.btn-primary:hover:not(:disabled){background:#2B3247;box-shadow:0 2px 10px rgba(27,33,48,.28)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--error);color:var(--white);flex:1;max-width:220px}
.btn-danger:hover:not(:disabled){background:#A63A2F}
.btn-danger:disabled{opacity:.5;cursor:not-allowed}

/* ── Live counter ── */
.answered-strip{
  width:100%;max-width:640px;margin-top:10px;padding:0 4px;
  font-family:var(--font-mono);font-variant-numeric:tabular-nums;
  font-size:.82rem;color:var(--ink-soft);text-align:right;
}

/* ── Screens ── */
.screen{display:none;width:100%;max-width:640px;flex-direction:column;align-items:center}
.screen.active{display:flex}

/* ── Submit confirmation modal ──
   Opens OVER the current (last) question — screenTest stays active and the
   question underneath stays exactly as it was, unlike the old review screen
   which navigated away from it via showScreen(). */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(27,33,48,.55);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:200;
}
.modal-backdrop.hidden{display:none}
.confirm-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:32px 28px;text-align:center;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(27,33,48,.24);
}
.confirm-card h2{font-size:1.25rem;font-weight:800;color:var(--ink);margin-bottom:10px}
.confirm-card p{font-size:.95rem;color:var(--ink-soft);margin-bottom:6px;line-height:1.5}
.confirm-warning{
  background:var(--accent-tint);border:1px solid var(--accent);border-radius:10px;
  padding:12px 16px;margin:18px 0;font-size:.85rem;color:var(--ink);line-height:1.5;
  text-align:left;font-weight:600;
}
.confirm-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn-outline{background:var(--white);color:var(--ink);border:2px solid var(--ink);min-height:44px;padding:11px 22px;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .15s}
.btn-outline:hover:not(:disabled){background:var(--bg)}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-outline:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ── Results ── */
.results-hero{text-align:center;padding:36px 20px 0}
.score-big{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:3.5rem;font-weight:800;color:var(--ink);line-height:1}
.score-denom{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:600;color:var(--ink-faint)}
.score-pct{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1rem;color:var(--ink-soft);margin-top:6px}
.breakdown-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  width:100%;margin:22px 0 0;
}
.breakdown-item{
  background:var(--white);border:1px solid var(--border);border-radius:12px;
  padding:16px 10px;text-align:center;
}
.breakdown-item .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:800;color:var(--ink)}
.breakdown-item .lbl{font-size:.7rem;color:var(--ink-soft);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* ── Small instruction line (all question types) ── */
.q-hint{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;line-height:1.45}

/* ── Submit status (score post-back) ── */
.submit-status{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;justify-content:center;
  max-width:640px;margin:0 auto 1rem;padding:.75rem 1rem;border-radius:12px;
  font-size:.9rem;font-weight:600;line-height:1.45;background:var(--info-tint);color:var(--info);border:1px solid var(--info)}
.submit-status.saved{background:var(--success-tint);color:var(--success);border-color:var(--success)}
.submit-status.saved #btnRetrySubmit{display:none}
.submit-status.errorState{background:var(--error-tint);color:var(--error);border-color:var(--error)}
.submit-status #btnRetrySubmit{flex:none}

/* ── Locked (answered-and-advanced) question state ──
   Belt-and-braces: normal flow never re-renders a question you've already
   moved past, but if some future code path did, these disable the control
   itself rather than relying on the missing click handler alone. */
.mc-option.is-locked{opacity:.6;cursor:not-allowed;pointer-events:none}
.tile:disabled{opacity:.55;cursor:not-allowed}
.tile:disabled:hover{background:var(--white)}
.tile.placed:disabled:hover{background:var(--accent);color:var(--ink)}
.wo-reset:disabled{opacity:.5;cursor:not-allowed}
.tr-input:disabled{opacity:.6;cursor:not-allowed;background:var(--bg)}

/* ── Misc ── */
.spacer{flex:1}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){.tile,.mc-option,.btn,.palette-tile{transition:none}}
</style>
</head>
<body>

<header class="lx-header" role="banner">
  <span class="lx-logo">Lexora</span>
  <span class="lx-meta" id="headerMeta" aria-live="polite">Present Continuous · Beginner</span>
</header>
<div class="progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Test progress" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- TEST SCREEN -->
<div id="screenTest" class="screen active" aria-label="Test questions">
  <div class="card" id="qCard">
    <div class="q-meta">
      <span class="q-num" id="qNum" aria-live="polite">Question 1 of 30</span>
      <span class="q-type-badge" id="qBadge"></span>
    </div>
    <div class="q-head">
      <div class="q-prompt" id="qPrompt" role="heading" aria-level="2" tabindex="-1"></div>
    </div>
    <div id="qBody"></div>
  </div>

  <div class="card palette-card" id="paletteCard">
    <details id="paletteDetails" open>
      <summary class="palette-summary-row">
        <span class="palette-summary-label">
          <svg class="palette-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Questions
        </span>
        <span class="palette-count" id="paletteCount">0/30 answered</span>
      </summary>
      <div class="palette-grid" id="paletteGrid" role="group" aria-label="Question status"></div>
      <div class="palette-legend">
        <span class="palette-legend-item"><span class="palette-legend-swatch current" aria-hidden="true"></span>Current</span>
        <span class="palette-legend-item"><span class="palette-legend-swatch answered" aria-hidden="true"></span>Answered</span>
        <span class="palette-legend-item"><span class="palette-legend-swatch" aria-hidden="true"></span>Unanswered</span>
      </div>
    </details>
  </div>

  <div class="answered-strip">
    Answered: <span id="answeredCount" aria-live="polite" aria-atomic="true">0</span> / <span id="answeredTotal">30</span>
  </div>

  <!-- Students: the advance button is the only forward control there is. On
       every question but the last it advances to the next question and locks
       the one just left; on the last question it opens the submit
       confirmation modal, and therefore is the only way a student can reach submit.
       Teacher/admin preview (no window.LEXORA_TEST bridge — see isPreview())
       additionally gets #btnPrevious, shown/hidden and enabled/disabled by
       renderNav() at render time. It stays in the markup and hidden by default
       so a student never sees it flash in before the bridge is detected. -->
  <div class="nav-row" id="navRow">
    <button class="btn btn-ghost hidden" id="btnPrevious" type="button" onclick="handlePrevious()" aria-label="Go to the previous question">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3l-5 5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Previous</span>
    </button>
    <button class="btn btn-primary btn-review" id="btnReview" type="button" onclick="handleAdvance()" aria-label="Go to the next question">
      <span id="btnReviewLabel">Next question</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- SUBMIT CONFIRMATION MODAL
     Opens over the last question instead of navigating to a review screen —
     screenTest stays active underneath and the question stays exactly as the
     student left it, editable, whether or not they go on to submit. Dismiss
     paths (Continue test / Escape / backdrop click) are only live before
     submission starts — see closeSubmitModal() and onModalKeydown(). -->
<div class="modal-backdrop hidden" id="submitModalBackdrop" onclick="if(event.target===this) closeSubmitModal()">
  <div class="card confirm-card" id="submitModalCard" role="dialog" aria-modal="true" aria-labelledby="submitModalHeading" aria-describedby="submitModalMsg">
    <h2 id="submitModalHeading" tabindex="-1">Submit test?</h2>
    <p id="submitModalMsg"></p>
    <div class="confirm-warning" role="alert">
      Once submitted you cannot change your answers.
    </div>
    <div class="confirm-btns">
      <button class="btn-outline" type="button" id="btnContinueTest" onclick="closeSubmitModal()">Continue test</button>
      <button class="btn btn-danger" id="btnFinalSubmit" type="button" onclick="handleFinalSubmit()">Submit test</button>
    </div>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div id="screenResults" class="screen" aria-label="Test results">
  <div class="results-hero">
    <div role="status" aria-live="assertive" aria-label="Your score">
      <div><span class="score-big" id="scoreBig" tabindex="-1">0</span><span class="score-denom">/<span id="scoreDenom">30</span></span></div>
      <div class="score-pct" id="scorePct"></div>
    </div>
  </div>
  <div class="submit-status hidden" id="submitStatus" role="status" aria-live="polite">
    <span id="submitStatusText"></span>
    <button class="btn-outline" id="btnRetrySubmit" onclick="postScore()">Try again</button>
  </div>
  <div class="breakdown-grid" id="breakdownGrid"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// BANK (80 questions)
// ─────────────────────────────────────────────────────────────────────────────
const BANK = [
  // MC positive (8 items needed → ids 31-33,38-41 + one more from remaining mc pos)
  {id:31,type:"mc",pol:"pos",prompt:"My sister ___ in her room now.",choices:["is dancing","is danceing","are dancing","dances"],correct:0},

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function fisherYates(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function canon(s){
  s=(s||"").toLowerCase().replace(/['']/g,"'").trim().replace(/\s+/g," ").replace(/[.?!]+$/,"");
  const map={"isn't":"is not","aren't":"are not","i'm":"i am","she's":"she is","he's":"he is","it's":"it is","we're":"we are","they're":"they are","what's":"what is","where's":"where is","who's":"who is","that's":"that is","doesn't":"does not","don't":"do not"};
  for(const k in map){s=s.split(k).join(map[k]);}
  // Contractions on names/nouns ("Dilnoza's dancing") are correct English too, but
  // only when the next word is the -ing verb — otherwise 's is a possessive
  // ("my sister's cake") and must be left alone.
  s=s.replace(/'s (?=\S+ing\b)/g," is ");
  s=s.replace(/'re (?=\S+ing\b)/g," are ");
  s=s.replace(/'m (?=\S+ing\b)/g," am ");
  return s.replace(/\s+/g," ").trim();
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAW 30 BALANCED QUESTIONS
// ─────────────────────────────────────────────────────────────────────────────
function drawQuestions(){
  const buckets={mc:{pos:[],neg:[],q:[]},wo:{pos:[],neg:[],q:[]},tr:{pos:[],neg:[],q:[]}};
  for(const q of BANK) buckets[q.type][q.pol].push(q);

  // MC: 4 pos + 4 neg + 4 q = 12
  // WO: 3 pos + 3 neg + 3 q = 9
  // TR: 3 pos + 3 neg + 3 q = 9  → 30 total
  const DRAW_PLAN=[
    ["mc","pos",4],["mc","neg",4],["mc","q",4],
    ["wo","pos",3],["wo","neg",3],["wo","q",3],
    ["tr","pos",3],["tr","neg",3],["tr","q",3],
  ];

  const drawn=[];
  for(const [type,pol,n] of DRAW_PLAN){
    const bucket=buckets[type][pol];
    // A bucket that has shrunk below its quota would silently yield a short test,
    // so make it loud rather than letting the count drift.
    if(bucket.length<n) console.error(`[Lexora] bank bucket ${type}/${pol} has ${bucket.length} items but the draw needs ${n} — this attempt will be short.`);
    drawn.push(...fisherYates(bucket).slice(0,n));
  }

  // Deep-copy and shuffle MC choices, shuffle combined
  const processed=drawn.map(q=>{
    if(q.type==="mc"){
      const shuffled=fisherYates(q.choices.map((c,i)=>({text:c,orig:i})));
      const newCorrect=shuffled.findIndex(c=>c.orig===q.correct);
      return {...q,shuffledChoices:shuffled.map(c=>c.text),shuffledCorrect:newCorrect};
    }
    if(q.type==="wo"){
      return {...q,shuffledTiles:fisherYates(q.tiles)};
    }
    return {...q};
  });

  return fisherYates(processed);
}

// ─────────────────────────────────────────────────────────────────────────────
// PREVIEW DETECTION
// The server injects window.LEXORA_TEST = {attemptId, submitUrl} right before
// </body> — AFTER this file's own <script> block — only when a real student
// attempt row exists. So at the moment this script first runs (boot), the
// bridge is never there yet, even for a real student: a boot-time check would
// wrongly call every student "preview". This is evaluated lazily, at render
// time, instead of being frozen into a constant — see the window "load"
// listener at the bottom of this file for how the very first paint is
// corrected once the bridge has actually had a chance to run.
// ─────────────────────────────────────────────────────────────────────────────
function isPreview(){
  return !(window.LEXORA_TEST && window.LEXORA_TEST.submitUrl);
}

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let questions=drawQuestions();
let TOTAL=questions.length;
let current=0;
// answers: for mc → chosen index; for wo → array of placed chunks; for tr → string
let answers=Array(TOTAL).fill(null);
// wo placed/pool per question
let woState={}; // { qIndex: { placed:[], pool:[] } }
let submitted=false;

// ─────────────────────────────────────────────────────────────────────────────
// IN-PROGRESS PERSISTENCE
// A refresh or an accidental back-swipe used to wipe the attempt and re-draw a
// different 30 questions. Persist the draw itself alongside the answers so the
// student comes back to the exact test they were sitting.
// ─────────────────────────────────────────────────────────────────────────────
const STORE_KEY="lexora:present-continuous-beginner:v1:"+((window.LEXORA_TEST&&window.LEXORA_TEST.attemptId)||"local");

function saveState(){
  if(submitted) return;
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({questions,answers,current,woState}));
  }catch(e){/* private mode / quota — the test still works, just without resume */}
}

function clearState(){
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
}

// A saved question must still carry everything the renderer and grader reach
// for. Valid JSON is not the same as a usable attempt: `{"questions":[null]}`
// parses fine, passes an Array.isArray check, and then throws on the first
// render — stranding the student on a blank exam with no way back. Anything
// that fails this check is discarded in favour of a fresh draw.
function validQuestion(q){
  if(!q||typeof q!=="object") return false;
  if(typeof q.id==="undefined") return false;
  // Element types matter as much as the array itself: canon() does
  // (s||"").toLowerCase(), so a single non-string inside `accepted`, `accept` or
  // `tiles` throws during GRADING — which happens after submitTest() has already
  // set submitted=true and cleared the saved attempt. That is the one failure
  // mode that both loses the work and returns no result, so these arrays are
  // checked element by element rather than just for their shape.
  if(q.type==="mc") return strings(q.shuffledChoices)&&q.shuffledChoices.length>0
    // Only labels A–D are defined, so a longer restored list renders blanks.
    &&q.shuffledChoices.length<=MC_MAX_CHOICES
    // Out of range would render a question nobody can answer correctly.
    &&Number.isInteger(q.shuffledCorrect)&&q.shuffledCorrect>=0
    &&q.shuffledCorrect<q.shuffledChoices.length
    &&typeof q.prompt==="string";
  if(q.type==="wo") return strings(q.shuffledTiles)&&q.shuffledTiles.length>0
    &&strings(q.tiles)&&q.tiles.length>0
    // `accept` is optional, but gradeQuestion() feeds it straight to canon().
    &&(q.accept===undefined||strings(q.accept));
  if(q.type==="tr") return strings(q.accepted)&&q.accepted.length>0
    &&typeof q.uz==="string";
  return false;
}

const MC_MAX_CHOICES=4; // matches the A–D labels the renderer defines
function strings(v){return Array.isArray(v)&&v.every(x=>typeof x==="string");}

// Rejecting a bad *question* is not enough: a well-formed question carrying a
// malformed ANSWER or woState entry still throws later, and worst of all it
// throws inside submitTest() — which has already set submitted=true and wiped
// the saved attempt before grading. That combination loses the student's work
// and gives them no result. So coerce every restored answer to the shape its
// question type expects, dropping anything that doesn't fit rather than
// trusting it. A dropped answer costs one question; a throw costs the attempt.
function sanitizeRestored(){
  answers=questions.map((q,i)=>{
    const a=answers[i];
    if(a===null||a===undefined) return null;
    if(q.type==="mc") return Number.isInteger(a)&&a>=0&&a<q.shuffledChoices.length?a:null;
    if(q.type==="wo") return Array.isArray(a)&&a.every(t=>typeof t==="string")?a:null;
    return typeof a==="string"?a:null; // tr — canon() would throw on a non-string
  });
  const clean={};
  questions.forEach((q,i)=>{
    if(q.type!=="wo") return;
    const s=woState[i];
    // renderWO only rebuilds this when it is falsy, so a truthy-but-wrong shape
    // like {} would survive and throw on state.placed.length.
    if(!s||typeof s!=="object") return;
    if(!strings(s.placed)||!strings(s.pool)) return;
    // placed + pool must still account for exactly this question's tiles, and
    // the stored answer must match what the tiles show. Otherwise a tampered
    // snapshot can display a finished sentence while grading it unanswered, or
    // show empty tiles while grading a hidden answer — the student would see one
    // thing and be marked on another.
    if(!sameTiles(s.placed.concat(s.pool),q.shuffledTiles)) return;
    const a=answers[i];
    if(a!==null&&!sameOrder(a,s.placed)) return;
    clean[i]=s;
  });
  woState=clean;
  // Drop any WO answer whose tile state was just rejected, so the two can never
  // disagree after sanitizing.
  questions.forEach((q,i)=>{
    if(q.type==="wo"&&answers[i]!==null&&!clean[i]) answers[i]=null;
  });
}

function sameOrder(a,b){
  return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every((x,i)=>x===b[i]);
}

// Multiset comparison — tiles legitimately repeat ("is", "the"), so sorting and
// comparing beats any set-based check.
function sameTiles(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  const x=[...a].sort(),y=[...b].sort();
  return x.every((v,i)=>v===y[i]);
}

function restoreState(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(STORE_KEY)||"null");}catch(e){return false;}
  if(!saved||!Array.isArray(saved.questions)||!saved.questions.length) return false;
  if(!Array.isArray(saved.answers)||saved.answers.length!==saved.questions.length) return false;
  if(!saved.questions.every(validQuestion)) return false;
  questions=saved.questions;
  TOTAL=questions.length;
  answers=saved.answers;
  woState=saved.woState&&typeof saved.woState==="object"?saved.woState:{};
  // Older saved attempts may still carry a `flags` field from when flag-for-
  // review existed — ignored here rather than validated, so it neither
  // restores nor throws.
  current=Number.isInteger(saved.current)&&saved.current>=0&&saved.current<TOTAL?saved.current:0;
  sanitizeRestored();
  return true;
}

window.addEventListener("beforeunload",e=>{
  if(submitted) return;
  if(!answers.some(a=>a!==null)) return;
  e.preventDefault();
  e.returnValue="";
});

// ─────────────────────────────────────────────────────────────────────────────
// RENDER ENGINE
// ─────────────────────────────────────────────────────────────────────────────
function renderQuestion(opts){
  const q=questions[current];
  const idx=current;

  // Header meta
  document.getElementById("qNum").textContent=`Question ${idx+1} of ${TOTAL}`;
  document.title=`Q${idx+1}/${TOTAL} — Present Continuous | Lexora`;

  // Progress — count the question you are on, so the last one reads 100%.
  const pct=Math.round(((idx+1)/TOTAL)*100);
  document.getElementById("progressFill").style.width=pct+"%";
  document.getElementById("progressBar").setAttribute("aria-valuenow",pct);

  // Badge
  const badge=document.getElementById("qBadge");
  const labels={mc:"Multiple Choice",wo:"Word Order",tr:"Translation"};
  const cls={mc:"badge-mc",wo:"badge-wo",tr:"badge-tr"};
  badge.textContent=labels[q.type];
  badge.className="q-type-badge "+cls[q.type];

  // Prompt
  const promptEl=document.getElementById("qPrompt");
  if(q.type==="tr") promptEl.textContent=q.uz;
  else promptEl.textContent=q.prompt;

  // Body
  const body=document.getElementById("qBody");
  body.innerHTML="";

  if(q.type==="mc") renderMC(q,idx,body);
  else if(q.type==="wo") renderWO(q,idx,body);
  else renderTR(q,idx,body);

  // One-way progression for students: the advance button is "Next question" on
  // every question but the last, where it becomes "Finish test". There is no
  // way back to a question once a student has moved past it. Unchanged by
  // preview — preview gets an additional Previous button (see renderNav()),
  // not a different advance button.
  //
  // The last-question label says "Finish test", NOT "Review answers": there is
  // no review screen any more. The button opens the submit confirmation modal
  // directly over this question (see openSubmitModal()), so promising a review
  // step would be a lie about what the click does — and a student expecting a
  // summary they can page through would read the modal as that summary.
  const btnReviewLabel=document.getElementById("btnReviewLabel");
  const btnReview=document.getElementById("btnReview");
  if(idx<TOTAL-1){
    btnReviewLabel.textContent="Next question";
    btnReview.setAttribute("aria-label","Go to the next question");
  }else{
    btnReviewLabel.textContent="Finish test";
    btnReview.setAttribute("aria-label","Finish the test and open the submit confirmation");
  }
  renderNav();

  updateAnsweredCount();
  saveState();

  // Moving between questions replaces the card in place. Put focus on the new
  // prompt so it is read out and so Tab continues from the right place.
  if(opts&&opts.focus) promptEl.focus();
}

// ── MC ──
function renderMC(q,idx,body){
  // Students only: answered-and-advanced questions lock. Teacher/admin preview
  // (isPreview()) never locks anything — a previewer must be free to
  // re-inspect and re-answer a question they've paged back to with Previous.
  const isLocked=idx<current&&!isPreview();

  const hint=document.createElement("p");
  hint.className="q-hint";
  hint.textContent="Tap the correct word to fill the gap.";
  body.appendChild(hint);
  const grp=document.createElement("div");
  grp.role="radiogroup";
  grp.setAttribute("aria-label","Choose the correct option");
  grp.className="mc-group";
  const letters=["A","B","C","D"];

  q.shuffledChoices.forEach((text,ci)=>{
    const opt=document.createElement("div");
    opt.className="mc-option"+(isLocked?" is-locked":"");
    opt.setAttribute("role","radio");
    const checked=(answers[idx]===ci);
    opt.setAttribute("aria-checked",checked?"true":"false");
    if(isLocked){
      opt.setAttribute("aria-disabled","true");
      opt.setAttribute("tabindex","-1");
    }else{
      opt.setAttribute("tabindex",checked||(answers[idx]===null && ci===0)?0:-1);
    }
    opt.dataset.ci=ci;
    opt.innerHTML=`
      <div class="mc-indicator">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none" aria-hidden="true">
          <path d="M1 4l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="mc-letter">${letters[ci]}</span>
      <span class="mc-text">${esc(text)}</span>`;
    if(!isLocked){
      opt.addEventListener("click",()=>selectMC(idx,ci));
      opt.addEventListener("keydown",e=>{
        if(e.key===" "||e.key==="Enter"){e.preventDefault();selectMC(idx,ci);}
        if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();moveMCFocus(grp,1);}
        if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();moveMCFocus(grp,-1);}
      });
    }
    grp.appendChild(opt);
  });

  body.appendChild(grp);
}

function moveMCFocus(grp,dir){
  const opts=[...grp.querySelectorAll(".mc-option")];
  const cur=opts.findIndex(o=>o===document.activeElement);
  const next=(cur+dir+opts.length)%opts.length;
  opts[next].focus();
}

function selectMC(idx,ci){
  // Locked for students only — see the matching isLocked check in renderMC().
  // Preview must be able to re-answer a question it has paged back to.
  if(idx<current&&!isPreview()) return;
  answers[idx]=ci;
  // re-render just the options
  const grp=document.getElementById("qBody").querySelector(".mc-group");
  if(!grp) return;
  grp.querySelectorAll(".mc-option").forEach(opt=>{
    const oci=parseInt(opt.dataset.ci);
    const sel=(oci===ci);
    opt.setAttribute("aria-checked",sel?"true":"false");
    opt.setAttribute("tabindex",sel?0:-1);
  });
  updateAnsweredCount();
}

// ── WO ──
function renderWO(q,idx,body){
  // See the matching comment in renderMC — locks for students, never for
  // teacher/admin preview.
  const isLocked=idx<current&&!isPreview();

  if(!woState[idx]){
    woState[idx]={placed:[],pool:[...q.shuffledTiles]};
  }
  const state=woState[idx];

  const instr=document.createElement("p");
  instr.className="q-hint";
  instr.textContent="Tap the words in the correct order to make a sentence. Tap a word again to send it back.";
  body.appendChild(instr);

  const answerArea=document.createElement("div");
  answerArea.className="wo-answer-area"+(state.placed.length?" has-tiles":"");
  answerArea.setAttribute("aria-label","Your sentence");
  answerArea.id="woAnswer_"+idx;

  const pool=document.createElement("div");
  pool.className="wo-pool";
  pool.setAttribute("aria-label","Available word tiles");
  pool.id="woPool_"+idx;

  function refreshWO(){
    answerArea.innerHTML="";
    answerArea.className="wo-answer-area"+(state.placed.length?" has-tiles":"");
    pool.innerHTML="";

    state.placed.forEach((chunk,pi)=>{
      const t=document.createElement("button");
      t.className="tile placed";
      t.textContent=chunk;
      t.setAttribute("aria-label","Remove: "+chunk);
      t.disabled=isLocked;
      if(!isLocked){
        t.addEventListener("click",()=>{
          state.placed.splice(pi,1);
          state.pool.push(chunk);
          answers[idx]=state.placed.length>0?[...state.placed]:null;
          updateAnsweredCount();
          refreshWO();
        });
      }
      answerArea.appendChild(t);
    });

    state.pool.forEach((chunk,pi)=>{
      const t=document.createElement("button");
      t.className="tile";
      t.textContent=chunk;
      t.setAttribute("aria-label","Add: "+chunk);
      t.disabled=isLocked;
      if(!isLocked){
        t.addEventListener("click",()=>{
          state.placed.push(chunk);
          state.pool.splice(pi,1);
          answers[idx]=[...state.placed];
          updateAnsweredCount();
          refreshWO();
        });
      }
      pool.appendChild(t);
    });
  }

  const resetBtn=document.createElement("button");
  resetBtn.className="wo-reset";
  resetBtn.textContent="Clear / Reset";
  resetBtn.setAttribute("aria-label","Reset word order");
  resetBtn.disabled=isLocked;
  if(!isLocked){
    resetBtn.addEventListener("click",()=>{
      state.placed=[];
      state.pool=[...q.shuffledTiles];
      answers[idx]=null;
      updateAnsweredCount();
      refreshWO();
    });
  }

  refreshWO();
  body.appendChild(answerArea);
  body.appendChild(pool);
  body.appendChild(resetBtn);
}

// ── TR ──
function renderTR(q,idx,body){
  // See the matching comment in renderMC — locks for students, never for
  // teacher/admin preview.
  const isLocked=idx<current&&!isPreview();

  const label=document.createElement("label");
  label.className="tr-label";
  label.setAttribute("for","trInput_"+idx);
  label.textContent="Write this sentence in English:";
  body.appendChild(label);

  const input=document.createElement("input");
  input.type="text";
  input.className="tr-input";
  input.id="trInput_"+idx;
  input.placeholder="Your English translation…";
  input.autocomplete="off";
  input.autocorrect="off";
  input.autocapitalize="off";
  input.spellcheck=false;
  input.disabled=isLocked;
  if(answers[idx]!==null) input.value=answers[idx];
  if(!isLocked){
    input.addEventListener("input",()=>{
      const v=input.value.trim();
      answers[idx]=v.length>0?v:null;
      updateAnsweredCount();
    });
  }
  body.appendChild(input);

  const hint=document.createElement("p");
  hint.className="tr-hint";
  hint.textContent="Use am / is / are + verb-ing. Short forms like isn't and I'm are fine.";
  body.appendChild(hint);
}

// ─────────────────────────────────────────────────────────────────────────────
// QUESTION PALETTE
// ─────────────────────────────────────────────────────────────────────────────
function paletteItems(){
  return questions.map((q,i)=>({
    answered: answers[i]!==null && answers[i]!==undefined
  }));
}

// Renderer for the in-test palette. (It used to be shared with a second
// palette on the pre-submit review screen; that screen is gone — "Finish test"
// now opens the submit confirmation modal directly — so this is the only
// caller left.)
// Read-only status display, not navigation: a plain <span> with no tabindex,
// no role=button and no click handler, so it is neither clickable nor
// reachable by keyboard. The test is strictly one-way — this grid can only
// ever report where the student is, never move them.
function renderPaletteGrid(gridEl,opts){
  if(!gridEl) return;
  opts=opts||{};
  const items=paletteItems();
  gridEl.innerHTML="";
  items.forEach((item,i)=>{
    const tile=document.createElement("span");
    const isCurrent=!!opts.highlightCurrent && i===current;
    let cls="palette-tile";
    if(isCurrent) cls+=" is-current";
    else if(item.answered) cls+=" is-answered";
    tile.className=cls;
    if(isCurrent) tile.setAttribute("aria-current","true");
    tile.setAttribute("aria-label",`Question ${i+1}, ${item.answered?"answered":"not answered"}`);
    tile.textContent=String(i+1);
    gridEl.appendChild(tile);
  });
}

// One-way progression: advances to the next question and — by the mere fact
// that it moved current forward — locks the one just left, since every
// render checks idx<current. On the last question this instead opens the
// submit confirmation modal, the sole gateway to submit. It does NOT move
// `current` or re-render — the last question stays exactly as rendered,
// fully editable, whether the student goes on to submit or backs out.
function handleAdvance(){
  if(current<TOTAL-1){
    current++;
    renderQuestion({focus:true});
  }else{
    openSubmitModal();
  }
}

// Teacher/admin preview only (see isPreview()). A student never reaches this:
// the Previous button is hidden for them by renderNav(), and handleAdvance()
// above never gives them a way to go backward either. The isPreview() guard
// below is belt-and-braces in case something ever calls this directly.
function handlePrevious(){
  if(!navReady||!isPreview()) return;
  if(current<=0) return;
  current--;
  renderQuestion({focus:true});
}

// FAIL CLOSED ON THE BOOT WINDOW. The server injects the window.LEXORA_TEST
// bridge immediately before </body> — AFTER this script block — so during the
// first render isPreview() cannot tell a student from a previewer and answers
// "preview" for everyone. Revealing Previous on that answer would flash a
// backward-navigation control at a real student for the length of the parse,
// and a click landing inside that window would actually move them backwards.
// navReady starts false and is only set by the window "load" listener at the
// bottom of this file, which is guaranteed to run after the injected bridge
// has executed. Until then Previous stays hidden for EVERYONE: a previewer
// waits a few milliseconds for it to appear, which costs nothing, while a
// student is never shown it at all. handlePrevious() checks the same flag, so
// even a synthesised click in that window does nothing.
let navReady=false;

// Shows/hides the Previous button. Preview (no window.LEXORA_TEST bridge) gets
// it, enabled once past question 1; students never do. Re-read on every call
// rather than cached, so it reflects the bridge's true state whenever it runs.
function renderNav(){
  const navRow=document.getElementById("navRow");
  const btnPrevious=document.getElementById("btnPrevious");
  if(navReady&&isPreview()){
    navRow.classList.add("has-prev");
    btnPrevious.classList.remove("hidden");
    btnPrevious.disabled=(current===0);
  }else{
    navRow.classList.remove("has-prev");
    btnPrevious.classList.add("hidden");
    btnPrevious.disabled=true;
  }
}

function updateAnsweredCount(){
  const n=answers.filter(a=>a!==null).length;
  document.getElementById("answeredCount").textContent=n;
  document.getElementById("answeredTotal").textContent=TOTAL;
  const paletteGrid=document.getElementById("paletteGrid");
  if(paletteGrid) renderPaletteGrid(paletteGrid,{highlightCurrent:true});
  const paletteCount=document.getElementById("paletteCount");
  if(paletteCount) paletteCount.textContent=`${n}/${TOTAL} answered`;
  saveState();
}

// ─────────────────────────────────────────────────────────────────────────────
// SUBMIT CONFIRMATION MODAL
// Opens over the current (last) question instead of navigating to a separate
// review screen. Nothing here touches `current`, `answers` or re-renders the
// question underneath — Continue test simply closes the modal and the student
// is exactly where they were, still able to edit. Submit test hands off to the
// existing submitTest() unchanged.
// ─────────────────────────────────────────────────────────────────────────────
function openSubmitModal(){
  const items=paletteItems();
  const answeredN=items.filter(i=>i.answered).length;
  const unansweredN=items.length-answeredN;

  document.getElementById("submitModalMsg").textContent=unansweredN>0
    ? `${unansweredN} unanswered question${unansweredN===1?"":"s"} will score zero. Submitting is final — you cannot change your answers after this.`
    : `All ${TOTAL} questions answered. Submitting is final — you cannot change your answers after this.`;

  const continueBtn=document.getElementById("btnContinueTest");
  const submitBtn=document.getElementById("btnFinalSubmit");
  continueBtn.disabled=false;
  submitBtn.disabled=false;

  document.getElementById("submitModalBackdrop").classList.remove("hidden");
  document.addEventListener("keydown",onModalKeydown);
  document.getElementById("submitModalHeading").focus();
}

// Only a live dismiss path while nothing has been submitted yet — once
// handleFinalSubmit() has fired, submitted flips true and this becomes a
// no-op, so Escape/backdrop/Continue can no longer close (or appear to
// re-open) the modal mid-submission.
function closeSubmitModal(){
  if(submitted) return;
  document.getElementById("submitModalBackdrop").classList.add("hidden");
  document.removeEventListener("keydown",onModalKeydown);
  const btnReview=document.getElementById("btnReview");
  if(btnReview) btnReview.focus();
}

function onModalKeydown(e){
  if(e.key==="Escape"){
    e.preventDefault();
    closeSubmitModal();
  }
}

// UI-level backstop on top of submitTest()'s own `if(submitted) return;`
// guard: disable both modal buttons and drop the Escape listener the instant
// submission begins, so a second click, a stray Escape, or a repeat call here
// can never fire a second submitTest().
function handleFinalSubmit(){
  if(submitted) return;
  document.getElementById("btnContinueTest").disabled=true;
  document.getElementById("btnFinalSubmit").disabled=true;
  document.removeEventListener("keydown",onModalKeydown);
  submitTest();
}

// ─────────────────────────────────────────────────────────────────────────────
// GRADE + RESULTS
// ─────────────────────────────────────────────────────────────────────────────
function gradeQuestion(q,idx){
  const ans=answers[idx];
  if(ans===null||ans===undefined) return false;
  if(q.type==="mc") return ans===q.shuffledCorrect;
  if(q.type==="wo"){
    if(!Array.isArray(ans)) return false;
    if(ans.length!==q.tiles.length) return false;
    // Some sentences have more than one correct order ("Are you waiting for the
    // bus" / "You are waiting for the bus"), so compare the built sentence
    // against tiles plus any alternates rather than tile-by-tile.
    const built=canon(ans.join(" "));
    return [q.tiles.join(" ")].concat(q.accept||[]).some(a=>canon(a)===built);
  }
  if(q.type==="tr"){
    const c=canon(ans);
    return q.accepted.some(a=>canon(a)===c);
  }
  return false;
}

let postInFlight=false;
let postSucceeded=false;
let finalScore=0;

function submitTest(){
  if(submitted) return;
  submitted=true;
  clearState(); // the attempt is over — don't resume it on a later visit
  document.getElementById("btnFinalSubmit").disabled=true;

  const results=questions.map((q,idx)=>({q,idx,correct:gradeQuestion(q,idx)}));
  const total=results.filter(r=>r.correct).length;
  finalScore=total;

  // Breakdown
  const mc=results.filter(r=>r.q.type==="mc");
  const wo=results.filter(r=>r.q.type==="wo");
  const tr=results.filter(r=>r.q.type==="tr");
  const mcC=mc.filter(r=>r.correct).length;
  const woC=wo.filter(r=>r.correct).length;
  const trC=tr.filter(r=>r.correct).length;

  // Score display
  document.getElementById("scoreBig").textContent=total;
  document.getElementById("scoreDenom").textContent=TOTAL;
  document.getElementById("scorePct").textContent=Math.round((total/TOTAL)*100)+"% correct";

  // Test is done — show the progress bar as complete.
  document.getElementById("progressFill").style.width="100%";
  document.getElementById("progressBar").setAttribute("aria-valuenow",100);

  // Breakdown grid
  const grid=document.getElementById("breakdownGrid");
  grid.innerHTML=`
    <div class="breakdown-item">
      <div class="num">${mcC}<span style="font-size:.9rem;color:var(--ink-soft)">/${mc.length}</span></div>
      <div class="lbl">Multiple Choice</div>
    </div>
    <div class="breakdown-item">
      <div class="num">${woC}<span style="font-size:.9rem;color:var(--ink-soft)">/${wo.length}</span></div>
      <div class="lbl">Word Order</div>
    </div>
    <div class="breakdown-item">
      <div class="num">${trC}<span style="font-size:.9rem;color:var(--ink-soft)">/${tr.length}</span></div>
      <div class="lbl">Translation</div>
    </div>`;

  showScreen("screenResults","scoreBig");
  window.scrollTo({top:0,behavior:"smooth"});

  postScore();
}

// What the student actually answered, as plain text the server can re-grade
// against its own key. Choice INDEXES would be meaningless server-side because
// the options are shuffled per attempt, so send the chosen text.
function answerPayload(){
  return questions.map((q,i)=>{
    const a=answers[i];
    let value=null;
    if(a!==null&&a!==undefined){
      if(q.type==="mc") value=q.shuffledChoices[a];
      else if(q.type==="wo") value=Array.isArray(a)?a.join(" "):null;
      else value=String(a);
    }
    return {id:q.id,value:value};
  });
}

// Send the score to the platform. A failure here used to be swallowed, so a
// student could see their result while the server never recorded it — say so
// out loud instead, and let them retry.
function postScore(){
  const cfg=window.LEXORA_TEST;
  if(!cfg||!cfg.attemptId||!cfg.submitUrl) return; // opened standalone, nothing to post to
  if(postInFlight||postSucceeded) return;

  postInFlight=true;
  setSubmitStatus("pending","Saving your result…");

  fetch(cfg.submitUrl,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      attemptId:cfg.attemptId,
      skills:[{skill:"GRAMMAR",correct:finalScore,total:TOTAL}],
      // The server re-grades these and ignores the score above when it holds a
      // key for this test — the client's number is a display value, not a claim.
      answers:answerPayload()
    })
  })
    .then(res=>res.ok?res.json().catch(()=>({})):Promise.reject(new Error("HTTP "+res.status)))
    .then(data=>{
      postSucceeded=true;
      // The server refuses to score the same attempt twice. If this was a
      // repeat visit, say that plainly rather than implying fresh XP.
      setSubmitStatus("saved",data&&data.alreadySubmitted
        ?"You already completed this test. This attempt was not scored again."
        :"Result saved to your Lexora account.");
    })
    .catch(()=>{
      setSubmitStatus("error","We couldn't save your result. Check your connection and try again — don't close this page yet.");
    })
    .finally(()=>{postInFlight=false;});
}

function setSubmitStatus(kind,msg){
  const box=document.getElementById("submitStatus");
  document.getElementById("submitStatusText").textContent=msg;
  box.classList.remove("hidden");
  box.classList.toggle("saved",kind==="saved");
  box.classList.toggle("errorState",kind==="error");
  document.getElementById("btnRetrySubmit").disabled=(kind==="pending");
}


// ─────────────────────────────────────────────────────────────────────────────
// SCREEN SWITCH
// ─────────────────────────────────────────────────────────────────────────────
// Screens swap in place, so move focus into the new one — otherwise a keyboard
// or screen-reader user is left on a button that no longer exists. The submit
// modal is not a .screen (it overlays screenTest rather than replacing it), so
// it is not touched by the loop below — but submitTest() reaching the results
// screen means submission is done and the modal, if still visually present
// underneath, must not linger over it. Belt-and-braces: handleFinalSubmit()
// already leaves it hidden-imminently via submitTest()'s own flow, this just
// guarantees it regardless of call site.
function showScreen(id,focusId){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  const modal=document.getElementById("submitModalBackdrop");
  if(modal) modal.classList.add("hidden");
  if(focusId){
    const target=document.getElementById(focusId);
    if(target) target.focus();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────────────────
function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
// Last line of defence: validQuestion() rejects the shapes we know about, but a
// student who cannot render ANY question has no way to sit the exam. If a
// restored attempt still blows up, throw it away and start a clean draw rather
// than leaving them on a dead screen.
restoreState(); // resume an interrupted attempt, if there is one
try{
  renderQuestion();
}catch(e){
  console.error("[Lexora] restored attempt failed to render — starting a fresh draw.",e);
  clearState();
  questions=drawQuestions();
  TOTAL=questions.length;
  answers=Array(TOTAL).fill(null);
  woState={};
  current=0;
  renderQuestion();
}
// The palette stays open at every width. It used to collapse under 640px; keep
// it open regardless so a phone student always has the status grid visible,
// even though it is now read-only and forward progress comes from the
// Next question / Finish test button instead.

// This file's own <script> block — including the boot renderQuestion() call
// above — runs before the platform injects window.LEXORA_TEST right before
// </body>. So the very first paint's nav (rendered via renderNav() inside
// renderQuestion()) is computed with isPreview() defaulting to true even for
// a real student, since the bridge genuinely isn't there yet. "load" fires
// only once every inline script in the document — including the injected
// bridge script after this one — has finished running, so by the time this
// listener runs, window.LEXORA_TEST is set for a student and isPreview() reads
// correctly. Re-run just the nav render (not a full renderQuestion()) to
// correct that first paint without disturbing anything else — no re-render of
// answers, no stolen focus, no re-drawn WO tiles.
//
// navReady flips here and nowhere else. Before this point renderNav() keeps
// Previous hidden for everyone (see its comment), so the boot window can never
// show a student a backward-navigation control it would then take away.
window.addEventListener("load",function(){
  navReady=true;
  renderNav();
});
</script>
</body>
</html>
